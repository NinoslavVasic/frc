<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Moonshot Properties</title>
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; manifest-src 'self'; upgrade-insecure-requests">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#15110d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&amp;family=Montserrat:wght@400;500&amp;display=swap">
<style>
:root{--bg:#fff;--ink:#111;--muted:#6b6b6b;--rule:#9c7c4f;--accent:#6b5330;--on-accent:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111;--ink:#f5f4f2;--muted:#8e8a84;--rule:#b99a6b;--accent:#b99a6b;--on-accent:#111;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:400 16px/1.6 Montserrat,system-ui,sans-serif;padding:32px}
main{max-width:560px;display:flex;flex-direction:column;gap:24px}
.label{font:500 12px/1.3 Montserrat,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
h1{font:300 clamp(40px,7vw,64px)/1.05 'Cormorant Garamond',Georgia,serif;margin:0}
hr{width:56px;height:1px;background:var(--rule);border:0;margin:0}
p{margin:0;color:var(--muted)}
a.btn{align-self:flex-start;display:inline-flex;font:500 12.5px/1 Montserrat,sans-serif;letter-spacing:.16em;text-transform:uppercase;padding:18px 26px;background:var(--accent);color:var(--on-accent);text-decoration:none}
a.btn:hover{background:var(--ink);color:var(--bg)}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <span class="label">Error 404</span>
  <h1>That page is not here.</h1>
  <hr>
  <p>The link may be old, or the address may have a typo in it. Everything available to lease is on the front page.</p>
  <a class="btn" href="/#available">See available space</a>
  <p style="font-size:15px">Looking for something specific? Write to <a href="mailto:joe@moonshot-properties.nyc">joe@moonshot-properties.nyc</a> or call 917.992.5581.</p>
</main>
</body>
</html>
